<!doctype html>
<html lang="en" data-accent="cyan">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Star quest: campaign — teacher view</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ctext y=%2718%27 font-size=%2718%27%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="chip">Teacher view</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
  </div>

  <h2 style="margin-top:12px">Where she is</h2>
  <p class="subprompt">
    Open a save file, paste a save code, or read this device’s own progress.
    Nothing is uploaded &mdash; everything here is read locally.
  </p>

  <div class="week">
    <div class="actions" style="margin-top:0">
      <button class="btn" id="openFile" type="button">Open a save file</button>
      <button class="btn ghost" id="readLocal" type="button">Read this device</button>
      <input type="file" id="filePicker" accept="application/json,.json" class="hidden">
    </div>
    <label for="codeBox" class="src" style="display:block;margin-top:14px">…or paste a save code / link</label>
    <textarea class="field" id="codeBox" placeholder="Paste the whole link or code here"></textarea>
    <div class="actions">
      <button class="btn ghost" id="readCode" type="button">Read the code</button>
    </div>
  </div>

  <main id="out"></main>

  <p class="note">
    The 12-week plan behind this campaign is at
    <a href="https://grammarmetric.github.io/star-quest-course/">star-quest-course</a>.
    No student’s name is stored in a save file or a save code.
  </p>
</div>

<script src="js/icons.js"></script>
<script src="js/cards.js"></script>
<script src="js/progress.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
